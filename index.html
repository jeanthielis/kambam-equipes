<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kambam de Equipes - Vue & Tailwind</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            900: '#1e3a8a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Apenas estilos essenciais para o Drag and Drop e Scrollbar que o Tailwind não cobre nativamente com facilidade */
        body { font-family: 'Inter', sans-serif; }
        .drag-over { background-color: rgba(59, 130, 246, 0.1); border: 2px dashed #3b82f6; }
        .dragging { opacity: 0.5; transform: scale(1.02); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex flex-col transition-colors duration-300">

<div id="app" class="h-full flex flex-col overflow-hidden" v-cloak>
    
    <header class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 p-4 shrink-0 transition-colors duration-300">
        <div class="flex justify-between items-center max-w-full">
            <h1 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                <svg class="w-6 h-6 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Gestão de Equipes
            </h1>
            
            <div class="flex items-center gap-3">
                <div class="relative">
                    <input type="text" v-model="searchQuery" placeholder="Buscar colaborador..." 
                           class="w-64 pl-10 pr-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
                    <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
                </div>

                <button @click="toggleTheme" class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors" title="Alternar Tema">
                    {{ isDark ? '☀️' : '🌙' }}
                </button>
                
                <div class="w-px h-6 bg-gray-300 dark:bg-gray-600 mx-1"></div>
                
                <button @click="addTeam" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">
                    + Nova Equipe
                </button>
            </div>
        </div>
    </header>

    <div class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-3 shrink-0 flex gap-6 overflow-x-auto">
        <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Total</span>
            <span class="bg-gray-100 dark:bg-gray-700 px-2.5 py-1 rounded-md text-sm font-semibold">{{ totalMembers }}</span>
        </div>
        <div class="w-px h-6 bg-gray-200 dark:bg-gray-700"></div>
        <div class="flex items-center gap-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Por Cargo</span>
            <div v-for="role in db.roles" :key="role.id" class="flex items-center gap-1.5 text-sm">
                <span class="w-3 h-3 rounded-full" :style="{ backgroundColor: role.color }"></span>
                <span>{{ role.name }}: <strong>{{ countByRole(role.id) }}</strong></span>
            </div>
        </div>
    </div>

    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex gap-6 h-full items-start">
            
            <div v-for="team in db.teams" :key="team.id" 
                 class="bg-gray-100 dark:bg-gray-800 rounded-xl w-80 min-w-[20rem] max-h-full flex flex-col shadow-sm border border-gray-200 dark:border-gray-700 transition-colors duration-300">
                
                <div class="p-4 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
                    <div class="flex items-center gap-2">
                        <input type="text" v-model="team.title" @change="saveData"
                               class="bg-transparent font-bold text-lg text-gray-800 dark:text-gray-100 focus:outline-none focus:bg-white dark:focus:bg-gray-700 px-1 rounded w-48 transition-colors">
                        <span class="bg-gray-200 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-xs font-bold px-2 py-1 rounded-full">
                            {{ team.members.length }}
                        </span>
                    </div>
                    <button @click="deleteTeam(team.id)" class="text-gray-400 hover:text-red-500 transition-colors" title="Remover Equipe">✖</button>
                </div>

                <div class="flex-1 overflow-y-auto p-3 space-y-3 min-h-[100px]"
                     @dragover.prevent="allowDrop"
                     @dragleave="leaveDrop"
                     @drop="drop($event, team.id)">
                    
                    <div v-for="member in filteredMembers(team.members)" :key="member.id"
                         draggable="true"
                         @dragstart="dragStart($event, member, team.id)"
                         @dragend="dragEnd"
                         class="bg-white dark:bg-gray-700 p-3 rounded-lg shadow-sm border-l-4 cursor-grab active:cursor-grabbing hover:shadow-md transition-all group"
                         :style="{ borderLeftColor: getRoleColor(member.roleId) }">
                        
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-semibold text-gray-800 dark:text-gray-100">{{ member.name }}</h4>
                            
                            <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                                <button @click="editMember(team.id, member)" class="p-1 text-gray-400 hover:text-brand-500">✎</button>
                                <button @click="deleteMember(team.id, member.id)" class="p-1 text-gray-400 hover:text-red-500">✖</button>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap gap-2 mt-2">
                            <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-full text-white"
                                  :style="{ backgroundColor: getRoleColor(member.roleId) }">
                                {{ getRoleName(member.roleId) }}
                            </span>
                            <span class="text-xs bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-md border border-gray-200 dark:border-gray-600 flex items-center gap-1">
                                📍 {{ member.area }}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="p-3 border-t border-gray-200 dark:border-gray-700">
                    <button @click="openModal(team.id)" class="w-full py-2 flex items-center justify-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors">
                        <span>+</span> Adicionar Colaborador
                    </button>
                </div>
            </div>

        </div>
    </main>

    <div v-if="showModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-6">
                <h3 class="text-xl font-bold mb-4">{{ modalData.id ? 'Editar' : 'Novo' }} Colaborador</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Nome Completo</label>
                        <input type="text" v-model="modalData.name" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-brand-500 outline-none">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Cargo</label>
                        <select v-model="modalData.roleId" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option v-for="role in db.roles" :value="role.id">{{ role.name }}</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Área / Máquina</label>
                        <select v-model="modalData.area" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 focus:ring-2 focus:ring-brand-500 outline-none">
                            <option v-for="area in areas" :value="area">{{ area }}</option>
                        </select>
                    </div>
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button @click="showModal = false" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancelar</button>
                    <button @click="saveMember" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition-colors shadow-sm">Guardar</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const { createApp, ref, computed, onMounted, watch } = Vue;

    createApp({
        setup() {
            // Estado inicial com as 4 equipes 
            const defaultDb = {
                teams: [
                    { id: 't1', title: 'Equipe A', members: [] },
                    { id: 't2', title: 'Equipe B', members: [] },
                    { id: 't3', title: 'Equipe C', members: [] },
                    { id: 't4', title: 'Equipe D', members: [] }
                ],
                roles: [
                    { id: 'r1', name: 'Líder', color: '#dc2626' }, 
                    { id: 'r2', name: 'Operador', color: '#2563eb' }
                ]
            };

            const db = ref(defaultDb);
            const isDark = ref(false);
            const searchQuery = ref('');
            const showModal = ref(false);
            const areas = ["Controle do Produto", "Qualitron L4", "Qualitron L5", "Qualitron 6A", "Qualitron 6B", "Inspeção", "Outros / volante"];
            
            // Controle do Modal
            const modalData = ref({ id: null, teamId: null, name: '', roleId: '', area: '' });
            
            // Drag and Drop State
            let draggedItem = null;
            let sourceTeamId = null;

            // --- CICLO DE VIDA ---
            onMounted(() => {
                const saved = localStorage.getItem('kambamVueData');
                if (saved) db.value = JSON.parse(saved);
                
                const theme = localStorage.getItem('theme');
                if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    isDark.value = true;
                    document.documentElement.classList.add('dark');
                }
            });

            // Auto-save quando o db muda
            watch(db, (newVal) => {
                localStorage.setItem('kambamVueData', JSON.stringify(newVal));
            }, { deep: true });

            // --- COMPUTED PROPERTIES ---
            const totalMembers = computed(() => {
                return db.value.teams.reduce((acc, team) => acc + team.members.length, 0);
            });

            const countByRole = (roleId) => {
                return db.value.teams.reduce((acc, team) => {
                    return acc + team.members.filter(m => m.roleId === roleId).length;
                }, 0);
            };

            const getRoleName = (roleId) => {
                const r = db.value.roles.find(x => x.id === roleId);
                return r ? r.name : 'Desconhecido';
            };

            const getRoleColor = (roleId) => {
                const r = db.value.roles.find(x => x.id === roleId);
                return r ? r.color : '#9ca3af';
            };

            // Filtro de pesquisa em tempo real
            const filteredMembers = (members) => {
                if (!searchQuery.value) return members;
                const q = searchQuery.value.toLowerCase();
                return members.filter(m => m.name.toLowerCase().includes(q) || m.area.toLowerCase().includes(q));
            };

            // --- MÉTODOS ---
            const toggleTheme = () => {
                isDark.value = !isDark.value;
                if (isDark.value) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            const addTeam = () => {
                db.value.teams.push({
                    id: 't' + Date.now(),
                    title: 'Nova Equipe',
                    members: []
                });
            };

            const deleteTeam = (id) => {
                if(confirm('Tem certeza que deseja excluir esta equipe inteira?')) {
                    db.value.teams = db.value.teams.filter(t => t.id !== id);
                }
            };

            const openModal = (teamId) => {
                modalData.value = { id: null, teamId, name: '', roleId: db.value.roles[0]?.id || '', area: areas[0] };
                showModal.value = true;
            };

            const editMember = (teamId, member) => {
                modalData.value = { ...member, teamId };
                showModal.value = true;
            };

            const saveMember = () => {
                if (!modalData.value.name) return alert('Preencha o nome!');
                
                const team = db.value.teams.find(t => t.id === modalData.value.teamId);
                
                if (modalData.value.id) {
                    // Atualizar existente
                    const index = team.members.findIndex(m => m.id === modalData.value.id);
                    team.members[index] = { ...modalData.value };
                } else {
                    // Novo
                    team.members.push({
                        id: 'm' + Date.now(),
                        name: modalData.value.name,
                        roleId: modalData.value.roleId,
                        area: modalData.value.area
                    });
                }
                showModal.value = false;
            };

            const deleteMember = (teamId, memberId) => {
                if(confirm('Remover colaborador?')) {
                    const team = db.value.teams.find(t => t.id === teamId);
                    team.members = team.members.filter(m => m.id !== memberId);
                }
            };

            // --- DRAG AND DROP NATIVO ---
            const dragStart = (e, member, teamId) => {
                draggedItem = member;
                sourceTeamId = teamId;
                setTimeout(() => e.target.classList.add('dragging'), 0);
            };

            const dragEnd = (e) => {
                e.target.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            };

            const allowDrop = (e) => {
                e.currentTarget.classList.add('drag-over');
            };

            const leaveDrop = (e) => {
                e.currentTarget.classList.remove('drag-over');
            };

            const drop = (e, targetTeamId) => {
                e.currentTarget.classList.remove('drag-over');
                if (sourceTeamId === targetTeamId) return; // Soltou na mesma equipe

                // Remove da equipe de origem
                const sourceTeam = db.value.teams.find(t => t.id === sourceTeamId);
                sourceTeam.members = sourceTeam.members.filter(m => m.id !== draggedItem.id);

                // Adiciona na equipe de destino
                const targetTeam = db.value.teams.find(t => t.id === targetTeamId);
                targetTeam.members.push(draggedItem);
                
                draggedItem = null;
                sourceTeamId = null;
            };

            const saveData = () => {
                // Força o trigger do watch no db
                db.value = { ...db.value };
            };

            return {
                db, isDark, searchQuery, showModal, modalData, areas,
                totalMembers, countByRole, getRoleName, getRoleColor, filteredMembers,
                toggleTheme, addTeam, deleteTeam, openModal, editMember, saveMember, deleteMember,
                dragStart, dragEnd, allowDrop, leaveDrop, drop, saveData
            };
        }
    }).mount('#app');
</script>
</body>
</html>
